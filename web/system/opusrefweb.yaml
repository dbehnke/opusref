web:
  http_listen: "127.0.0.1:18080"
  monitor_listen: "127.0.0.1:18081"
  public_origin: "https://localhost:18443"
  open_access: true
  trusted_proxy_cidrs: ["127.0.0.0/8", "::1/128"]
reflector:
  udp_address: "127.0.0.1:14600"
  monitoring_url: "http://127.0.0.1:18082"
  node_callsign: "WEB"
  monitor_poll_interval: "100ms"
  monitor_stale_after: "3s"
  reconnect_initial: "50ms"
  reconnect_max: "500ms"
  shared_key_env: "OPUSREF_SYSTEM_SHARED_KEY"
  shared_key_file: ""
storage:
  sqlite_path: "__SYSTEM_DIR__/opusrefweb.db"
  archive_directory: "__SYSTEM_DIR__/recordings"
  retention: "24h"
  hard_quota_bytes: 10485760
  purge_interval: "1m"
  audit_retention: "720h"
authentication:
  session_idle: "12h"
  session_absolute: "168h"
  max_sessions_per_account: 3
  argon2_memory_kib: 19456
  argon2_iterations: 2
  argon2_parallelism: 1
  max_concurrent_hashes: 1
  password_blocklist_file: ""
webauthn:
  rp_id: ""
  rp_name: "OpusRef"
  origins: []
limits:
  max_websockets: 250
  max_websockets_per_session: 3
  live_queue_packets: 64
  live_queue_bytes: 131072
  playback_queue_packets: 64
  playback_queue_bytes: 131072
  transmit_queue_packets: 64
  control_queue_messages: 32
  archive_queue_packets: 512
  archive_queue_bytes: 1048576
  max_playbacks: 50
  playback_max_duration: "15m"
logging:
  level: "info"
  format: "json"
