worker_processes 1;
pid __SYSTEM_DIR__/nginx.pid;
error_log __SYSTEM_DIR__/nginx-error.log;
events { worker_connections 256; }
http {
  log_format system '$remote_addr "$request" $status origin="$http_origin" upgrade="$http_upgrade"';
  access_log __SYSTEM_DIR__/nginx-access.log system;
  server {
    listen 127.0.0.1:18443 ssl;
    server_name localhost;
    ssl_certificate __SYSTEM_DIR__/cert.pem;
    ssl_certificate_key __SYSTEM_DIR__/key.pem;
    location / {
      proxy_pass http://127.0.0.1:18080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
