worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr;
events { worker_connections 256; }
http {
  log_format system '$remote_addr "$request" $status origin="$http_origin" upgrade="$http_upgrade"';
  access_log /dev/stdout system;
  server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /work/cert.pem;
    ssl_certificate_key /work/key.pem;
    location / {
      proxy_pass http://host.docker.internal:18080;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
