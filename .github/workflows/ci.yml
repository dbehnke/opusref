name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      # Short fuzz smoke tests keep all wire decoders in the default CI gate.
      - run: go test ./pkg/wire -run '^$' -fuzz=FuzzDecode -fuzztime=2s
      - run: go test ./pkg/wire -run '^$' -fuzz=FuzzValidate -fuzztime=2s
      - run: go test ./internal/webapp/socket -run '^$' -fuzz=FuzzDecodeMedia -fuzztime=2s
      - run: go test ./internal/webapp/archive -run '^$' -fuzz=FuzzArchiveReader -fuzztime=2s
      - run: go build ./cmd/opusrefd ./cmd/opusrefctl ./cmd/opusrefweb
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- web/dist
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Install nginx for the reverse-proxy system gate
        run: sudo apt-get update && sudo apt-get install --yes nginx
      - run: npm run test:system-proxy
        working-directory: web
