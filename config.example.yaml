network:
  udp_listen: ":46000"

reflector:
  id: "OPUSREF"
  display_name: "OpusRef Test Reflector"

limits:
  max_clients: 100
  max_datagram_bytes: 1200
  inbound_queue_packets: 256
  outbound_media_queue_frames: 256
  outbound_control_queue_packets: 64
  max_pending_challenges: 100
  max_completed_transactions: 1024
  max_completed_transactions_per_session: 64
  max_pending_notifications: 200
  max_pending_notifications_per_client: 2
  recent_events: 256

timers:
  keepalive_interval: 10s
  session_timeout: 30s
  grant_timeout: 2s
  stream_inactivity_timeout: 1s
  transmit_time_limit: 180s
  health_deadline: 250ms
  shutdown_grace: 5s

authentication:
  # Open admission is used when both values are empty. Environment wins.
  shared_key_env: "OPUSREF_SHARED_KEY"
  shared_key_file: ""

monitoring:
  http_listen: "127.0.0.1:8080"

logging:
  level: "info"
  format: "json"
